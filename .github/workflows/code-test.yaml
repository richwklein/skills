name: 'Test'
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout source code'
        uses: actions/checkout@v6.0.2

      - name: 'Detect relevant changes'
        id: changes
        uses: ./.github/actions/detect-relevant-changes
        with:
          patterns: |
            ^(skills|tests)/
            ^pyproject\.toml$

      - name: 'No relevant changes — noop'
        if: steps.changes.outputs.relevant != 'true'
        run: echo "::notice::No relevant changes detected; skipping tests."

      - name: 'Run tests'
        if: steps.changes.outputs.relevant == 'true'
        run: python3 -m pytest tests/
