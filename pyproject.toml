[project]
name = "skills"
version = "0.0.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.17.5"]

[tool.setuptools]
packages = []
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
